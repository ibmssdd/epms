name: epms
description: EPMS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/EPMS_Syllabus_Master.csv
    - assets/database/epms.db
    - assets/branding/app_icon.png
    - assets/branding/splash_logo.png
    - assets/branding/app_logo.png


flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#080808"
  color_dark: "#080808"
  image: assets/branding/splash_logo.png

  android: true

  android_14:
    color: "#080808"
    color_dark: "#080808"
    image: assets/branding/app_icon.png
    icon_background_color: "#080808"
    icon_background_color_dark: "#080808"